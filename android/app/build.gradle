plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lamaa.studio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lamaa.studio'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            // Configure signing in signing.properties after creating your own upload key.
            if (project.hasProperty('LamaaStoreFile') && project.hasProperty('LamaaStorePassword') && project.hasProperty('LamaaKeyAlias') && project.hasProperty('LamaaKeyPassword')) {
                signingConfig signingConfigs.create('releaseLocal') {
                    storeType 'JKS'
                    storeFile file(project.property('LamaaStoreFile'))
                    storePassword project.property('LamaaStorePassword')
                    keyAlias project.property('LamaaKeyAlias')
                    keyPassword project.property('LamaaKeyPassword')
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
